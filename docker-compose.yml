# One-command local demo: docker compose up -d
#
#   web UI     http://localhost:8101  (log in: alice / bob / admin, password demo)
#   git http   http://localhost:8100/r/<repo>.git
#              credentials in the URL: http://alice:demo@localhost:8100/r/<repo>.git
#   git ssh    ssh://alice@localhost:8102/r/<repo>.git
#              demo keys in demo/ssh/ (GIT_SSH_COMMAND="ssh -i demo/ssh/alice ...")
#   thin CLI   go run ./cmd/banyan clone http://alice:demo@localhost:8100/r/<repo>
#
# Authorization is ON in this demo (demo/auth-demo.yaml): main is
# admin-push-only, /secret is admin-read-only, and refs/heads/<user>/*
# personal branches are visible to their owner alone (docs/07).
services:
  banyan:
    build: .
    image: banyan:dev
    container_name: banyan
    command: ["-config", "/etc/banyan/auth-demo.yaml"]
    ports:
      - "8100:8080" # git smart HTTP (credentials in URL or http.extraHeader)
      - "8102:8022" # git over SSH (public keys in auth.keys)
    volumes:
      - banyan-data:/var/lib/banyan # SQLite metadata + pack shards + ssh host key persist
      - ./demo/auth-demo.yaml:/etc/banyan/auth-demo.yaml:ro
    restart: unless-stopped

  web:
    build:
      context: web
      args:
        # Constrained networks point this at a mirror, e.g.
        #   https://registry.npmmirror.com
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: banyan-web:dev
    container_name: banyan-web
    environment:
      BANYAN_URL: http://banyan:8080
    ports:
      - "8101:3000"
    depends_on:
      - banyan
    restart: unless-stopped

volumes:
  banyan-data:
