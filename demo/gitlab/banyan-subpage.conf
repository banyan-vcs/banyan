# The banyan subtree-management control page under the GitLab URL
# (docs/20 §7b): nginx routes /-/banyan/ to the banyan-web service.
# Installed by demo/gitlab/provision.sh into
# /var/opt/gitlab/nginx/conf/gitlab-http.d/ (omnibus includes that
# directory inside the server block) followed by `gitlab-ctl hup nginx`.
#
# /-/ is GitLab's reserved application namespace (same family as
# /-/health) — a group can never be named "-", so the location can never
# shadow a project. proxy_pass WITHOUT a URI passes the full path through;
# the web service knows its BASE_PATH (/-/banyan) and routes from there.
location ^~ /-/banyan/ {
    proxy_pass http://banyan-gitlab-web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
