# The banyan subtree-management control page under the GitLab URL
# (docs/integration/gitlab-integration.md §7b): nginx routes /-/banyan/ to the banyan-web service.
#
# GitLab-CE 19.5's omnibus nginx has NO conf.d include inside the server
# block, so demo/gitlab/provision.sh splices this location into the
# rendered /var/opt/gitlab/nginx/conf/service_conf/gitlab-rails.conf
# (anchored on the health-partial include) and `gitlab-ctl hup`s nginx.
# This file is the canonical block — keep it in sync with the splice.
#
# /-/ is GitLab's reserved application namespace (same family as
# /-/health) — a group can never be named "-", so the location can never
# shadow a project. proxy_pass WITHOUT a URI passes the full path through;
# the web service knows its BASE_PATH (/-/banyan) and routes from there.
location ^~ /-/banyan/ {
    proxy_pass http://banyan-gitlab-web:3000;
    # $http_host carries the port ($host strips it) — the web tier derives
    # the OAuth redirect_uri from the Host header, and GitLab matches it
    # exactly.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
