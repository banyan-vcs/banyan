# banyan as a Gitaly storage node for GitLab-CE (docs/integration/gitaly-compat.md): metadata-plane
# SQLite + local shards, and the gitaly gRPC frontend that Rails/workhorse
# point at (the token and storage_name below must match gitlab.rb's
# git_data_dirs entry). Authorization stays in the front end — token
# 之后全信 is the gitaly trust model (docs/integration/gitaly-compat.md §3).
listen: "0.0.0.0:8080"
root: "/var/lib/banyan"
meta: sqlite

# GitLab SSO gates banyan's own HTTP face (docs/gateway/authorization.md §8c): GitLab-issued
# tokens (OAuth2 / PAT) authenticate — identity and instance-admin status
# come from GET /api/v4/user (fail-closed). Runtime subtree access rules
# (docs/gateway/authorization.md §8c) load on top automatically.
auth:
  gitlab_sso: "http://banyan-gitlab-ce:8180"

gitaly:
  listen: "0.0.0.0:8075"
  token: "banyan-gitlab-demo-token"
  storage_name: "default"
  # post-receive adapter: pushes through GitLab notify the platform's
  # push processing (events/pipelines/MR-from-push/cache expiry)
  gitlab:
    url: "http://banyan-gitlab-ce:8180"
    secret_path: "/etc/gitlab-shared/gitlab_shell_secret"
