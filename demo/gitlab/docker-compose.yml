# One-command GitLab-CE integration demo (docs/integration/gitaly-compat.md): a real GitLab whose
# only Gitaly storage node is banyan. GitLab-CE (pinned to the vendored
# protocol version, internal/gitaly/server.go ProtoVersion) keeps its web
# UI, auth, and workhorse; every git byte lands in banyan over the gitaly
# gRPC protocol.
#
#   docker compose -f demo/gitlab/docker-compose.yml up -d
#   demo/gitlab/provision.sh          # waits, mints a root PAT, runs the
#                                     # push + read-back walkthrough
#
#   GitLab UI  http://localhost:8180  (root / 2pPzp76xwdyirr4B2Kyh)
#   banyan API http://localhost:8170  (the storage node's own face)
#   子树管理  http://localhost:8180/-/banyan/  (GitLab SSO 登录)
#
# The demo VM needs ~4 GiB for GitLab; the gitlab.rb here is the trimmed
# footprint (puma 2 workers, sidekiq 5, monitoring off).
services:
  banyan:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: banyan:dev
    container_name: banyan-gitlab
    command: ["-config", "/etc/banyan/banyan-gitaly.yaml"]
    ports:
      - "8170:8080" # banyan's native API (repo listing, health)
      - "127.0.0.1:8175:8075" # the gitaly gRPC face, host-local for probes
    volumes:
      - banyan-gitlab-data:/var/lib/banyan
      - ./banyan-gitaly.yaml:/etc/banyan/banyan-gitaly.yaml:ro
      # GitLab's generated gitlab_shell secret (shared trust for the
      # post-receive adapter): read-only peek into the gitlab config volume
      - gitlab-config:/etc/gitlab-shared:ro
    restart: unless-stopped

  # The subtree-management control page (docs/integration/gitlab-integration.md §7): `banyand web` in the
  # gitlab profile — served UNDER the GitLab URL by the nginx location
  # provision.sh installs (no host port, the GitLab domain is the only
  # door). Login is GitLab SSO (provision.sh mints the OAuth application
  # into /config/gitlab-oauth.json); the console narrows to banyan's own
  # subtree features, and its sessions/import state lives in its own
  # sqlite under /data.
  banyan-web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        BASE_PATH: /-/banyan
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: banyan-web:dev
    container_name: banyan-gitlab-web
    environment:
      BANYAN_URL: http://banyan:8080
      BASE_PATH: /-/banyan
      BANYAN_WEB_PROFILE: gitlab
      BANYAN_WEB_DB: sqlite:/data/web.db
      BANYAN_GITLAB_URL: http://banyan-gitlab-ce:8180
      BANYAN_GITLAB_EXTERNAL_URL: http://localhost:8180
    volumes:
      - banyan-web-config:/config
      - banyan-web-data:/data
    depends_on:
      - banyan
    restart: unless-stopped

  gitlab:
    image: gitlab/gitlab-ce:19.5.3-ce.0
    container_name: banyan-gitlab-ce
    hostname: banyan-gitlab-ce
    environment:
      GITLAB_ROOT_PASSWORD: "2pPzp76xwdyirr4B2Kyh"
      GITLAB_OMNIBUS_CONFIG: "from_file('/omnibus_config/gitlab.rb')"
    ports:
      # omnibus nginx listens on the external_url port INSIDE the container
      # (http://localhost:8180), so the mapping is same-port, not 8180:80
      - "8180:8180" # web UI / git-over-HTTP / /-/banyan/ subpage
      - "8122:22" # git-over-SSH (gitlab-shell -> banyan SSHService)
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - ./gitlab.rb:/omnibus_config/gitlab.rb:ro
    depends_on:
      - banyan
    restart: unless-stopped

volumes:
  banyan-gitlab-data:
  banyan-web-config:
  banyan-web-data:
  gitlab-config:
  gitlab-logs:
