<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%BASE_URL%avatar.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>banyan console</title>
    <script>
      // Pre-paint theme: apply the stored manual choice before first render,
      // so a forced scheme never flashes the other one (theme.ts owns it after).
      (function () {
        try {
          var t = localStorage.getItem("banyan.theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
